<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Media Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2e3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --selected: #ffffff;
      --selected-text: #0f1117;
      --success: #34d399;
      --error: #f87171;
      --accent: #5b5fc7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }
    .container { width: 100%; max-width: 440px; }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      text-align: center;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 28px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="url"] {
      width: 100%;
      background: #12151e;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 22px;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus { border-color: var(--accent); }
    input[type="url"]::placeholder { color: #5f6368; }
    .section-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .format-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .format-btn, .quality-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }
    .format-btn:hover:not(.disabled),
    .quality-btn:hover:not(.disabled) {
      border-color: var(--accent);
      background: rgba(91,95,199,0.08);
    }
    .format-btn.active, .quality-btn.active {
      background: var(--selected);
      color: var(--selected-text);
      border-color: var(--selected);
      font-weight: 600;
    }
    .format-btn.disabled, .quality-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: -8px;
      margin-bottom: 22px;
    }
    .quality-row {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }
    .quality-btn {
      flex: 1;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .download-btn {
      width: 100%;
      background: #ffffff;
      color: #0f1117;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .download-btn:hover:not(:disabled) {
      background: #f0f0f0;
      transform: translateY(-1px);
    }
    .download-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
      word-break: break-word;
    }
    .status.show { display: flex; }
    .status.loading { background: rgba(91,95,199,0.15); color: #a5b4fc; }
    .status.success { background: rgba(52,211,153,0.12); color: var(--success); }
    .status.error { background: rgba(248,113,113,0.12); color: var(--error); }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(165,180,252,0.3);
      border-top-color: #a5b4fc;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      margin-top: 1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .platforms {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .platform {
      color: var(--muted);
      font-size: 0.75rem;
    }
    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Media Downloader</h1>
    <p class="subtitle">Paste a video link, pick a format, download.</p>

    <div class="card">
      <label for="url">Video link</label>
      <input type="url" id="url" placeholder="https://youtube.com/..." autocomplete="off" />

      <div class="section-title">Video Format</div>
      <div class="format-grid">
        <button class="format-btn active" data-format="none">None (Original)</button>
        <button class="format-btn" data-format="mp4">MP4</button>
        <button class="format-btn" data-format="webm">WEBM</button>
      </div>

      <div class="section-title">Audio</div>
      <div class="format-grid">
        <button class="format-btn" data-format="mp3">MP3 (Messenger)</button>
        <button class="format-btn" data-format="m4a">M4A (Instagram)</button>
        <button class="format-btn" data-format="wav">WAV (WhatsApp)</button>
        <button class="format-btn" data-format="ogg">OGG</button>
        <button class="format-btn" data-format="flac">FLAC</button>
        <button class="format-btn" data-format="aac">AAC</button>
      </div>
      <p class="hint">Choose your preferred audio format for messaging apps.</p>

      <div class="section-title">Quality</div>
      <div class="quality-row">
        <button class="quality-btn active" data-quality="best">Best</button>
        <button class="quality-btn" data-quality="1080">1080p</button>
        <button class="quality-btn" data-quality="720">720p</button>
        <button class="quality-btn" data-quality="480">480p</button>
      </div>

      <button class="download-btn" id="downloadBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download
      </button>

      <div class="status" id="status"></div>
    </div>

    <div class="platforms">
      <div class="platform">YouTube</div>
      <div class="platform">Facebook</div>
      <div class="platform">Instagram</div>
      <div class="platform">WhatsApp</div>
    </div>
    <footer>Supports YouTube • Instagram • Facebook • WhatsApp & more</footer>
  </div>

  <script>
    const BACKEND = "https://media-downloader-1-z19u.onrender.com";
    const AUDIO = ["mp3", "m4a", "wav", "ogg", "flac", "aac"];

    let selectedFormat = "none";
    let selectedQuality = "best";

    document.querySelectorAll(".format-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".format-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedFormat = btn.dataset.format;

        const isAudio = AUDIO.includes(selectedFormat);
        document.querySelectorAll(".quality-btn").forEach(q => {
          if (isAudio) q.classList.add("disabled");
          else q.classList.remove("disabled");
        });
      });
    });

    document.querySelectorAll(".quality-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.classList.contains("disabled")) return;
        document.querySelectorAll(".quality-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedQuality = btn.dataset.quality;
      });
    });

    const urlInput = document.getElementById("url");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");

    function showStatus(type, message) {
      statusEl.className = `status show ${type}`;
      if (type === "loading") {
        statusEl.innerHTML = `<div class="spinner"></div><span>${message}</span>`;
      } else {
        statusEl.innerHTML = `<span>${message}</span>`;
      }
    }

    downloadBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();

      if (!url) {
        showStatus("error", "একটা ভিডিও লিংক পেস্ট করো।");
        return;
      }
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        showStatus("error", "সঠিক লিংক দাও (https:// দিয়ে শুরু)।");
        return;
      }

      downloadBtn.disabled = true;
      showStatus("loading", "ডাউনলোড প্রস্তুত হচ্ছে... অপেক্ষা করো");

      try {
        const res = await fetch(`${BACKEND}/download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url: url,
            format: selectedFormat,
            quality: selectedQuality
          })
        });

        const contentType = res.headers.get("content-type") || "";

        if (!res.ok || contentType.includes("application/json")) {
          let errMsg = `Server error (${res.status})`;
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch (_) {}
          throw new Error(errMsg);
        }

        const blob = await res.blob();
        const contentDisp = res.headers.get("content-disposition") || "";
        let filename = "download.mp4";

        const match = contentDisp.match(/filename\*?=(?:UTF-8'')?["']?([^"';\n]+)/i)
                   || contentDisp.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
        if (match) {
          filename = decodeURIComponent(match[1].replace(/['"]/g, "").trim());
        } else {
          const ext = AUDIO.includes(selectedFormat) ? selectedFormat :
                      (selectedFormat === "none" ? "mp4" : selectedFormat);
          filename = `download.${ext}`;
        }

        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);

        showStatus("success", "ডাউনলোড শুরু হয়েছে! Downloads ফোল্ডার চেক করো।");
      } catch (err) {
        let msg = err.message || "কিছু একটা সমস্যা হয়েছে।";
        if (msg.includes("bot") || msg.includes("cookies")) {
          msg = "YouTube bot detection। cookies.txt আপডেট করুন।";
        } else if (msg.includes("Private")) {
          msg = "এই ভিডিওটি প্রাইভেট।";
        } else if (msg.toLowerCase().includes("unavailable")) {
          msg = "ভিডিওটি পাওয়া যায়নি।";
        }
        showStatus("error", msg);
      } finally {
        downloadBtn.disabled = false;
      }
    });

    urlInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        downloadBtn.click();
      }
    });
  </script>
</body>
</html>
